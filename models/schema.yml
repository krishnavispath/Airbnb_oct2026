models:
  - name: dim_listings_cleansed
    description: "Cleansed dimension table for Airbnb listings"
    columns:
      - name: listing_id
        description: "Primary key for each listing"
        data_tests:
          - not_null
          - unique

      - name: host_id
        description: "Foreign key referencing the host of the listing"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: "Type of room offered in the listing"
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']

      - name: minimum_nights
        description: '{{ doc("dim_listings_cleansed_minimum_nights") }}'
        data_tests:
          - positive_values

  - name: dim_hosts_cleansed
    description: "Cleansed dimension table for Airbnb hosts"
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        description: "Primary key for each host"
        data_type: integer
        data_tests:
          - positive_values

      - name: host_name
        description: "Name of the host"
        data_type: string
      - name: is_superhost
        description: "Indicates if the host is a superhost"
        data_type: boolean
      - name: host_created_at
        description: "Timestamp when the host was created"
        data_type: timestamp
      - name: host_updated_at
        description: "Timestamp when the host was last updated"
        data_type: timestamp